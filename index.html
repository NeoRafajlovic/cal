<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calorie Tracker by Neo Rafajlovic</title>
    <style>
      * {
  font-family: sans-serif;
  margin: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  background-color: #f2f2f2;
}

.container {
  padding: 20px;
  min-height: 700px;
  width: 400px;
  background-color: rgb(240, 240, 240);
  border: 2px solid grey;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  overflow-y: auto;
}

h2 {
  margin-bottom: 10px;
}

h3 {
  margin-top: 10px;
}

.container ul {
  height: 200px;
  overflow-y: auto;
  list-style: none;
  padding: 10px;
  background-color: white;
  border: 1px solid #ccc;
  margin-bottom: 10px;
  border-radius: 5px;
}

/* Make each li a flex container for remove button */
#itemList li,
.catalogue-list li {
  padding: 5px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Remove button style (for both lists) */
.remove-btn {
  background-color: red;
  color: white;
  border: none;
  width: 16px;
  height: 16px;
  font-size: 12px;
  line-height: 16px;
  text-align: center;
  margin-left: 6px;
  border-radius: 3px;
  cursor: pointer;
  padding: 0;
}

/* Inputs and buttons */
input[type="text"],
input[type="number"],
input[type="submit"],
button {
  padding: 8px;
  margin: 5px 0;
  width: calc(100% - 20px);
  border: 1px solid #999;
  border-radius: 4px;
  font-size: 1rem;
}

input[type="submit"],
button {
  width: 48%;
  background-color: #4caf50;
  color: white;
  border: none;
  cursor: pointer;
}

button {
  background-color: #f44336;
}

input[type="submit"]:hover {
  background-color: #45a049;
}

button:hover {
  background-color: #d32f2f;
}
    </style>
  </head>
  <body>
    <div class="container">
      <center><h2>Track Your Cals & Macros</h2></center>
      <hr />

      <ul id="itemList"></ul>

      <h3>
        Total Calories: <span id="totalCal">0</span> kcal<br />
        Total Protein: <span id="totalProtein">0</span> g<br />
        Total Carbs: <span id="totalCarbs">0</span> g<br />
        Total Fat: <span id="totalFat">0</span> g
      </h3>

      <hr />
      <br />

      <input type="text" placeholder="Item Name" id="itemName" />
      <input type="number" placeholder="Calories (kcal)" id="itemCal" />
      <input
        type="number"
        placeholder="Protein (g) (optional)"
        id="itemProtein"
      />
      <input type="number" placeholder="Carbs (g) (optional)" id="itemCarbs" />
      <input type="number" placeholder="Fat (g) (optional)" id="itemFat" />

      <input type="submit" value="Add" id="itemSubmit" />
      <button id="resetButton">Reset</button>
      <button id="saveToCatalogue">Save to Catalogue</button>

      <h3>Catalogue (click to add to log)</h3>
      <ul id="catalogueList" class="catalogue-list"></ul>
      <button id="clearCatalogueButton">Clear Catalogue</button>

      <script>
const itemList = document.getElementById("itemList");
const totalCal = document.getElementById("totalCal");
const totalProtein = document.getElementById("totalProtein");
const totalCarbs = document.getElementById("totalCarbs");
const totalFat = document.getElementById("totalFat");

const itemName = document.getElementById("itemName");
const itemCal = document.getElementById("itemCal");
const itemProtein = document.getElementById("itemProtein");
const itemCarbs = document.getElementById("itemCarbs");
const itemFat = document.getElementById("itemFat");

const itemSubmit = document.getElementById("itemSubmit");
const resetButton = document.getElementById("resetButton");
const saveToCatalogue = document.getElementById("saveToCatalogue");
const catalogueList = document.getElementById("catalogueList");
const clearCatalogueButton = document.getElementById("clearCatalogueButton");

let savedItems = JSON.parse(localStorage.getItem("items")) || [];
let savedCatalogue = JSON.parse(localStorage.getItem("catalogue")) || [];

let totals = savedItems.reduce(
  (acc, item) => {
    acc.cal += Number(item.cal) || 0;
    acc.protein += Number(item.protein) || 0;
    acc.carbs += Number(item.carbs) || 0;
    acc.fat += Number(item.fat) || 0;
    return acc;
  },
  { cal: 0, protein: 0, carbs: 0, fat: 0 }
);

updateTotalsDisplay();

savedItems.forEach((item) => {
  const li = createLoggedItem(item);
  itemList.append(li);
});

savedCatalogue.forEach((item) => {
  const li = createCatalogueItem(item);
  catalogueList.append(li);
});

itemSubmit.addEventListener("click", (e) => {
  e.preventDefault();

  const name = itemName.value.trim();
  if (!name) return;

  const cal = Number(itemCal.value) || 0;
  const protein = Number(itemProtein.value) || 0;
  const carbs = Number(itemCarbs.value) || 0;
  const fat = Number(itemFat.value) || 0;

  const item = { name, cal, protein, carbs, fat };

  const li = createLoggedItem(item);
  itemList.append(li);

  totals.cal += cal;
  totals.protein += protein;
  totals.carbs += carbs;
  totals.fat += fat;
  updateTotalsDisplay();

  savedItems.push(item);
  localStorage.setItem("items", JSON.stringify(savedItems));

  itemName.value = "";
  itemCal.value = "";
  itemProtein.value = "";
  itemCarbs.value = "";
  itemFat.value = "";
  itemName.focus();
});

saveToCatalogue.addEventListener("click", () => {
  const name = itemName.value.trim();
  if (!name) return;

  const cal = Number(itemCal.value) || 0;
  const protein = Number(itemProtein.value) || 0;
  const carbs = Number(itemCarbs.value) || 0;
  const fat = Number(itemFat.value) || 0;

  const item = { name, cal, protein, carbs, fat };
  savedCatalogue.push(item);
  localStorage.setItem("catalogue", JSON.stringify(savedCatalogue));

  const li = createCatalogueItem(item);
  catalogueList.append(li);

  // Clear inputs after saving to catalogue
  itemName.value = "";
  itemCal.value = "";
  itemProtein.value = "";
  itemCarbs.value = "";
  itemFat.value = "";
  itemName.focus();
});

clearCatalogueButton.addEventListener("click", () => {
  if (!confirm("Are you sure you want to clear your entire catalogue?")) return;
  savedCatalogue = [];
  localStorage.removeItem("catalogue");
  catalogueList.innerHTML = "";
});

resetButton.addEventListener("click", () => {
  if (
    !confirm(
      "Are you sure you want to reset everything? This will clear all items."
    )
  )
    return;

  itemList.innerHTML = "";
  totals = { cal: 0, protein: 0, carbs: 0, fat: 0 };
  updateTotalsDisplay();
  savedItems = [];
  localStorage.removeItem("items");

  itemName.value = "";
  itemCal.value = "";
  itemProtein.value = "";
  itemCarbs.value = "";
  itemFat.value = "";
  itemName.focus();
});

function updateTotalsDisplay() {
  totalCal.innerText = totals.cal || 0;
  totalProtein.innerText = totals.protein || 0;
  totalCarbs.innerText = totals.carbs || 0;
  totalFat.innerText = totals.fat || 0;
}

function formatItemText(item) {
  let parts = [`${item.name} - ${item.cal} kcal`];
  if (item.protein) parts.push(`P: ${item.protein}g`);
  if (item.carbs) parts.push(`C: ${item.carbs}g`);
  if (item.fat) parts.push(`F: ${item.fat}g`);
  return parts.join(", ");
}

function createCatalogueItem(item) {
  const li = document.createElement("li");

  li.classList.add("catalogue-item");

  const textSpan = document.createElement("span");
  textSpan.textContent = formatItemText(item);

  const removeButton = document.createElement("button");
  removeButton.textContent = "x";
  removeButton.classList.add("remove-btn");

  removeButton.addEventListener("click", (e) => {
    e.stopPropagation();
    savedCatalogue = savedCatalogue.filter((catalogueItem) => {
      return !(
        catalogueItem.name === item.name &&
        catalogueItem.cal === item.cal &&
        catalogueItem.protein === item.protein &&
        catalogueItem.carbs === item.carbs &&
        catalogueItem.fat === item.fat
      );
    });
    localStorage.setItem("catalogue", JSON.stringify(savedCatalogue));
    li.remove();
  });

  li.appendChild(textSpan);
  li.appendChild(removeButton);

  li.addEventListener("click", () => {
    totals.cal += item.cal;
    totals.protein += item.protein;
    totals.carbs += item.carbs;
    totals.fat += item.fat;
    updateTotalsDisplay();
    const newLi = createLoggedItem(item);
    itemList.append(newLi);

    savedItems.push(item);
    localStorage.setItem("items", JSON.stringify(savedItems));
  });

  return li;
}

function createLoggedItem(item) {
  const li = document.createElement("li");

  const textSpan = document.createElement("span");
  textSpan.textContent = formatItemText(item);

  const removeButton = document.createElement("button");
  removeButton.textContent = "x";
  removeButton.classList.add("remove-btn");

  removeButton.addEventListener("click", (e) => {
    e.stopPropagation();

    savedItems = savedItems.filter((savedItem) => {
      return !(
        savedItem.name === item.name &&
        savedItem.cal === item.cal &&
        savedItem.protein === item.protein &&
        savedItem.carbs === item.carbs &&
        savedItem.fat === item.fat
      );
    });
    localStorage.setItem("items", JSON.stringify(savedItems));

    totals.cal -= item.cal;
    totals.protein -= item.protein;
    totals.carbs -= item.carbs;
    totals.fat -= item.fat;
    updateTotalsDisplay();

    li.remove();
  });

  li.style.display = "flex";
  li.style.justifyContent = "space-between";
  li.style.alignItems = "center";

  li.appendChild(textSpan);
  li.appendChild(removeButton);

  return li;
}
      </script>
    </div>
  </body>
</html>
